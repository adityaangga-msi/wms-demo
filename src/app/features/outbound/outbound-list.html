<app-page-header title="Outbound" subtitle="Pengeluaran karton berbasis scan barcode.">
  <button mat-flat-button class="btn-copper" type="button" (click)="create()">
    <mat-icon>add</mat-icon>
    Buat Outbound
  </button>
</app-page-header>

<div class="card">
  <form class="filters" [formGroup]="filters">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Cari</mat-label>
      <input matInput formControlName="q" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">Semua</mat-option>
        @for (s of statuses; track s) {
          <mat-option [value]="s">{{ s }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <div class="table-wrap"><table mat-table [dataSource]="filtered()" class="wms-table">
    <ng-container matColumnDef="docNo">
      <th mat-header-cell *matHeaderCellDef>Doc No</th>
      <td mat-cell *matCellDef="let row" class="mono">
        <a [routerLink]="['/operations/outbound', row.id]">{{ row.docNo }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="outboundDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">{{ row.outboundDate | date: 'dd MMM yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef>Customer</th>
      <td mat-cell *matCellDef="let row">{{ row.customerName }}</td>
    </ng-container>
    <ng-container matColumnDef="warehouseCode">
      <th mat-header-cell *matHeaderCellDef>WH</th>
      <td mat-cell *matCellDef="let row" class="mono">{{ row.warehouseCode }}</td>
    </ng-container>
    <ng-container matColumnDef="totalCarton">
      <th mat-header-cell *matHeaderCellDef>Carton</th>
      <td mat-cell *matCellDef="let row">{{ row.totalCarton }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row"><app-status-badge [status]="row.status" /></td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/operations/outbound', row.id]">Buka</a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table></div>
  @if (!filtered().length) {
    <p class="empty">Belum ada dokumen outbound.</p>
  }
</div>
