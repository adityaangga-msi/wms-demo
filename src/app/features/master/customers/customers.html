<app-page-header title="Master Customer" subtitle="Data pelanggan untuk outbound.">
  <button mat-flat-button class="btn-copper" type="button" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Tambah Customer
  </button>
</app-page-header>

<div class="card">
  <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
    <mat-label>Cari customer</mat-label>
    <input matInput [value]="search()" (input)="onSearch($any($event.target).value)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-wrap"><table mat-table [dataSource]="filtered()" class="wms-table">
    <ng-container matColumnDef="customerCode">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let row" class="mono">{{ row.customerCode }}</td>
    </ng-container>
    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.customerName }}</td>
    </ng-container>
    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef>Contact</th>
      <td mat-cell *matCellDef="let row">{{ row.contact }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row"><app-status-badge [status]="row.status" /></td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row" class="actions">
        <button mat-icon-button type="button" (click)="openEdit(row)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button type="button" color="warn" (click)="remove(row)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table></div>
  @if (!filtered().length) {
    <p class="empty">Tidak ada data.</p>
  }
</div>
